<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network mapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6e9ed; --panel:#f6f7f9; --node:#ffffff; --soft:#dde2e8;
  --ink:#141c25; --muted:#586471; --line:#c3cad2; --link:#7b8793;
  --mx:#0b8a6a; --sw:#2455c3; --ap:#c0560f; --cam:#8a3fb5; --prt:#b3365f; --scn:#5f7f12; --oth:#5d6b78;
  --focus:#2455c3; --danger:#b3261e; --dangerbg:#b3261e;
  --sans:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1318; --panel:#161c23; --node:#1d252e; --soft:#242d37;
    --ink:#e5eaef; --muted:#8e9ba8; --line:#2f3a45; --link:#6b7885;
    --mx:#36c9a1; --sw:#7aa3ff; --ap:#f29a52; --cam:#c58cf0; --prt:#f07a9f; --scn:#a9cf55; --oth:#9aa7b4;
    --focus:#7aa3ff; --danger:#ff8f86; --dangerbg:#b3261e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1318; --panel:#161c23; --node:#1d252e; --soft:#242d37;
  --ink:#e5eaef; --muted:#8e9ba8; --line:#2f3a45; --link:#6b7885;
  --mx:#36c9a1; --sw:#7aa3ff; --ap:#f29a52; --cam:#c58cf0; --prt:#f07a9f; --scn:#a9cf55; --oth:#9aa7b4;
  --focus:#7aa3ff; --danger:#ff8f86; --dangerbg:#b3261e;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--sans)}
*,*::before,*::after{box-sizing:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:272px minmax(0,1fr) 332px;height:100%}
.side,.edit{background:var(--panel);overflow:auto;min-height:0}
.side{border-inline-end:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:22px}
.edit{border-inline-start:1px solid var(--line);padding:18px 16px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}

.brand h1{font:600 18px/1.2 var(--sans)}
.brand p{color:var(--muted);margin-top:4px;font-size:13px}
.side h2{font:600 13px/1.2 var(--sans);margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}

.btn{font:500 13px var(--sans);padding:7px 11px;border:1px solid var(--line);background:var(--node);color:var(--ink);border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.confirm{background:var(--dangerbg);color:#fff;border-color:var(--dangerbg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.adds{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px}
.adds .btn{padding:7px 6px;text-align:center}
.adds i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-inline-end:6px}

.net,.dev{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;text-align:start;padding:7px 9px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);font:500 13px var(--sans);cursor:pointer}
.net:hover,.dev:hover{background:var(--soft)}
.net.on,.dev.on{background:var(--soft);border-color:var(--line)}
.dev{border-inline-start:4px solid var(--c)}
.net .ct,.dev .ip{font:400 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.net .nm,.dev .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.newnet{display:flex;gap:6px;margin-bottom:10px}
.newnet input{flex:1;min-width:0}

input,select,textarea{font:400 13px var(--sans);color:var(--ink);background:var(--node);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input.mono{font-family:var(--mono);font-size:12.5px;direction:ltr;text-align:left}
textarea{resize:vertical}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar .title{flex:1 1 220px;min-width:160px;font:600 17px var(--sans);border-color:transparent;background:transparent;padding:5px 8px}
.bar .title:hover{border-color:var(--line)}
.bar .isp{flex:0 1 210px}
.grp{display:flex;align-items:center;gap:6px}
.zl{font:400 12px var(--mono);color:var(--muted);min-width:38px;text-align:center}
.langrow{flex:1 0 100%;display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.langrow select{width:auto;padding:5px 8px}
.status{flex:1 0 100%;font-size:12px;color:var(--muted);min-height:17px}

.canvas{flex:1;min-height:0;overflow:auto;background-color:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.canvas{direction:ltr}
.canvas svg{display:block;margin:0 auto}
.node{outline:none}
.node:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

.dh{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.dh i{width:10px;align-self:stretch;border-radius:3px;background:var(--c)}
.dh h2{font:600 16px/1.25 var(--sans);word-break:break-word}
.dh p{color:var(--muted);font-size:12.5px}
.f{display:grid;gap:4px;font-size:12px;color:var(--muted);margin-bottom:10px;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.edit h3{font:600 13px var(--sans);margin:16px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.empty h2{font:600 16px var(--sans);margin-bottom:6px}
.empty p{color:var(--muted)}
.delnote{font-size:12px;color:var(--muted);margin-top:6px}

.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--line)}
input[type=checkbox]{width:auto;padding:0;margin:0;accent-color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 10px;padding-top:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.srow{border:1px solid var(--line);border-radius:8px;background:var(--node);padding:8px;margin-bottom:6px}
.stop{display:flex;gap:6px;margin-bottom:6px}
.srow input,.srow select{padding:5px 6px;font-size:12px}
.portmeta{margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;direction:ltr}
.pt{position:relative;height:38px;padding:0;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:5px;background:var(--node);color:var(--ink);font:500 11px var(--mono);cursor:pointer}
.pt b{font-weight:500}
.pt.used{background:var(--soft)}
.pt.up{box-shadow:inset 0 -3px 0 var(--ink)}
.pt.on{outline:2px solid var(--ink);outline-offset:1px}
.pt i{position:absolute;right:3px;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--ap)}
.pedit{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--node)}
.pedit h4{margin:0 0 6px;font:600 13px var(--sans)}
.pedit p{margin:0 0 8px;font-size:12.5px}
.pedit .chk{padding-top:0}
.vrow{border:1px solid var(--line);border-radius:8px;background:var(--node);padding:8px;margin-bottom:6px}
.vtop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.vtop .vid{font:600 13px var(--sans);flex:1}
.vtop .vid small{font:400 11.5px var(--sans);color:var(--muted);margin-inline-start:4px}
.vc{width:28px;height:28px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--node);cursor:pointer}
.vx{padding:3px 8px;font-size:12px}
.vrow .g2{margin:0}
.vrow input{padding:5px 7px;font-size:12.5px}
.vform{display:grid;grid-template-columns:64px 1fr;gap:6px;margin-top:8px}
.vform .r2{grid-column:1/-1;display:flex;gap:6px}
.vform .r2 input{flex:1;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12.5px}
.legend[hidden]{display:none}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:4px;border-radius:2px;background:var(--c)}
.legend small{color:var(--muted);font:400 11.5px var(--mono)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font:600 16px var(--sans);margin-bottom:6px}
dialog p{color:var(--muted);margin-bottom:10px}
dialog textarea{font:400 12px var(--mono);margin-bottom:10px}
code{font:400 12.5px var(--mono)}

@media (max-width:900px){
  html,body{height:auto;min-height:100%}
  .app{display:flex;flex-direction:column;height:auto;min-height:100%}
  .main{order:1;height:64vh;min-height:380px}
  .edit{order:2;border-inline-start:0;border-top:1px solid var(--line)}
  .side{order:3;border-inline-end:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Networks and devices" data-i18n-aria="aria.side">
    <header class="brand">
      <h1>Network mapper</h1>
      <p data-i18n="brand.tag">Add your gear, then save the network as a file.</p>
    </header>

    <section>
      <h2 data-i18n="sec.networks">Networks</h2>
      <div id="nets" class="list"></div>
      <form id="newForm" class="newnet" autocomplete="off">
        <input id="newName" dir="auto" placeholder="New network name" aria-label="New network name" data-i18n-ph="net.newPh" data-i18n-aria="net.newPh" maxlength="80">
        <button class="btn primary" type="submit" data-i18n="net.create">Create</button>
      </form>
      <div class="row">
        <button class="btn" type="button" data-act="import" data-i18n="net.open">Open file</button>
        <button class="btn danger" type="button" id="delNet" data-act="del-net">Delete network</button>
      </div>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </section>

    <section>
      <h2 data-i18n="sec.devices">Devices</h2>
      <div class="adds">
        <button class="btn" type="button" data-act="add" data-type="mx" style="--c:var(--mx)"><i></i>MX</button>
        <button class="btn" type="button" data-act="add" data-type="switch" style="--c:var(--sw)"><i></i>Switch</button>
        <button class="btn" type="button" data-act="add" data-type="ap" style="--c:var(--ap)"><i></i>AP</button>
        <button class="btn" type="button" data-act="add" data-type="camera" style="--c:var(--cam)"><i></i>Camera</button>
        <button class="btn" type="button" data-act="add" data-type="printer" style="--c:var(--prt)"><i></i>Printer</button>
        <button class="btn" type="button" data-act="add" data-type="scanner" style="--c:var(--scn)"><i></i>Scanner</button>
        <button class="btn" type="button" data-act="add" data-type="other" style="--c:var(--oth)"><i></i>Other</button>
      </div>
      <div id="devs" class="list"></div>
    </section>

    <section>
      <h2 data-i18n="sec.vlans">VLANs</h2>
      <div id="vlans"></div>
      <form id="vlanForm" class="vform" autocomplete="off">
        <input id="vId" placeholder="ID" inputmode="numeric" maxlength="4" aria-label="VLAN ID" data-i18n-ph="vlan.idPh" data-i18n-aria="vlan.aria.id">
        <input id="vName" dir="auto" placeholder="Name, e.g. Staff" maxlength="40" aria-label="VLAN name" data-i18n-ph="vlan.namePh" data-i18n-aria="vlan.aria.name">
        <div class="r2">
          <input id="vSub" class="mono" placeholder="10.0.10.0/24" maxlength="43" aria-label="VLAN subnet" data-i18n-aria="vlan.aria.subnet">
          <button class="btn primary" type="submit" data-i18n="vlan.add">Add VLAN</button>
        </div>
      </form>
    </section>
  </aside>

  <main class="main">
    <div class="bar">
      <div class="langrow">
        <label for="lang" data-i18n="lang.label">Language</label>
        <select id="lang">
          <option value="en" lang="en">English</option>
          <option value="fr" lang="fr">Français</option>
          <option value="ar" lang="ar">العربية</option>
          <option value="es" lang="es">Español</option>
        </select>
      </div>
      <input id="netName" class="title" dir="auto" aria-label="Network name" data-i18n-aria="bar.netName" maxlength="80">
      <input id="isp" class="isp" dir="auto" aria-label="Internet provider" placeholder="Internet provider (optional)" data-i18n-aria="bar.isp" data-i18n-ph="bar.isp" maxlength="60">
      <div class="grp">
        <button class="btn" type="button" id="undoBtn" data-act="undo" title="Undo (Ctrl+Z)" data-i18n="bar.undo" data-i18n-title="bar.undoTip" disabled>Undo</button>
        <button class="btn" type="button" id="redoBtn" data-act="redo" title="Redo (Ctrl+Shift+Z)" data-i18n="bar.redo" data-i18n-title="bar.redoTip" disabled>Redo</button>
        <button class="btn" type="button" data-act="auto" title="Clear manual positions and re-run the layout" data-i18n="bar.auto" data-i18n-title="bar.autoTip">Auto-arrange</button>
        <button class="btn" type="button" data-act="zoom-out" aria-label="Zoom out" data-i18n-aria="bar.zoomOut">&minus;</button>
        <span id="zoomLbl" class="zl">100%</span>
        <button class="btn" type="button" data-act="zoom-in" aria-label="Zoom in" data-i18n-aria="bar.zoomIn">+</button>
        <button class="btn" type="button" data-act="fit" data-i18n="bar.fit">Fit</button>
      </div>
      <div class="grp">
        <button class="btn" type="button" data-act="export-png" data-i18n="bar.exportPng">Export PNG</button>
        <button class="btn" type="button" data-act="export-svg" data-i18n="bar.exportSvg">Export SVG</button>
        <button class="btn primary" type="button" data-act="save-file" data-i18n="bar.saveFile">Save file</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </div>
    <div class="legend" id="legend" hidden></div>
    <div class="canvas" id="canvas">
      <svg id="dia" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Network diagram" data-i18n-aria="aria.diagram"><g id="g"></g></svg>
    </div>
  </main>

  <aside class="edit" id="edit" aria-label="Device details" data-i18n-aria="edit.title"></aside>
</div>

<dialog id="fb">
  <form method="dialog">
    <h2 data-i18n="fb.title">Copy your network file</h2>
    <p id="fbMsg"></p>
    <textarea id="fbText" readonly rows="10"></textarea>
    <div class="row">
      <button class="btn" type="button" id="fbCopy" data-i18n="fb.copy">Copy text</button>
      <button class="btn primary" value="close" data-i18n="fb.close">Close</button>
    </div>
  </form>
</dialog>

function digitsOrEmpty(v){v=String(v==null?"":v);return /^\d{1,4}$/.test(v)?v:""}
function isPortUsed(e){return !!(e&&(e.name||e.vlan||e.poe||e.allowed||e.mode==="trunk"))}
function cleanSsids(a){
  return (Array.isArray(a)?a:[]).slice(0,16).filter(function(o){return o&&typeof o==="object"}).map(function(o){
    return {name:String(o.name||"").slice(0,64),vlan:digitsOrEmpty(o.vlan),band:BANDS.indexOf(String(o.band))>=0?String(o.band):"",sec:SEC.indexOf(o.sec)>=0?o.sec:""};
  });
}
function cleanPorts(o){
  var out={},n=0;
  if(o&&typeof o==="object"&&!Array.isArray(o))Object.keys(o).forEach(function(k){
    if(n>=128||!/^\d{1,3}$/.test(k)||+k<1)return;
    var e=o[k];if(!e||typeof e!=="object")return;
    var c={name:String(e.name||"").slice(0,80),vlan:digitsOrEmpty(e.vlan),mode:e.mode==="trunk"?"trunk":"access",poe:!!e.poe,allowed:String(e.allowed||"").slice(0,80)};
    if(isPortUsed(c)){out[String(+k)]=c;n++}
  });
  return out;
}

function sanitizeNet(o){
  if(!o||typeof o!=="object"||!Array.isArray(o.devices)) throw new Error(tr("err.notNetwork"));
  var seen={};
  var devices=o.devices.slice(0,500).filter(function(x){return x&&typeof x==="object"}).map(function(x){
    var d=blank(TYPES[x.type]?x.type:"switch");
    var id=String(x.id||"").replace(/[^\w-]/g,"");
    if(id&&!seen[id]) d.id=id;
    seen[d.id]=1;
    KEYS.forEach(function(k){d[k]=String(x[k]==null?"":x[k]).slice(0,1000)});
    d.uplinkId=String(x.uplinkId||"").replace(/[^\w-]/g,"");
    d.linkLag=!!x.linkLag;
    if(SPEEDS.indexOf(d.linkSpeed)<0)d.linkSpeed="";
    if(MEDIA.indexOf(d.linkMedia)<0)d.linkMedia="";
    d.lagCount=(/^\d{1,2}$/.test(d.lagCount)&&+d.lagCount>=2&&+d.lagCount<=16)?d.lagCount:"";
    if(WIFI.indexOf(d.wifi)<0)d.wifi="";
    d.ssidList=cleanSsids(x.ssidList);
    d.portMap=cleanPorts(x.portMap);
    if(!d.ssidList.length&&d.ssids){
      d.ssidList=d.ssids.split(/[,;\n]+/).map(function(z){return z.trim()}).filter(Boolean).slice(0,16).map(function(z){return {name:z.slice(0,64),vlan:"",band:"",sec:""}});
      d.ssids="";
    }
    if(Number.isFinite(x.x)) d.x=x.x;
    if(Number.isFinite(x.y)) d.y=x.y;
    return d;
  });
  var vseen={};
  var vlans=(Array.isArray(o.vlans)?o.vlans:[]).slice(0,200).filter(function(v){
    if(!v||typeof v!=="object"||!/^\d{1,4}$/.test(String(v.id)))return false;
    var id=String(v.id);if(vseen[id])return false;vseen[id]=1;return true;
  }).map(function(v,i){
    return {id:String(v.id),name:String(v.name||"").slice(0,40),subnet:String(v.subnet||"").slice(0,43),
      color:/^#[0-9a-fA-F]{6}$/.test(v.color)?v.color:PALETTE[i%PALETTE.length]};
  });
  function addVlanId(id){
    if(/^\d{1,4}$/.test(id)&&!vseen[id]){vseen[id]=1;vlans.push({id:id,name:"",subnet:"",color:PALETTE[vlans.length%PALETTE.length]})}
  }
  devices.forEach(function(d){
    addVlanId(d.vlan);
    d.ssidList.forEach(function(z){addVlanId(z.vlan)});
    Object.keys(d.portMap).forEach(function(k){addVlanId(d.portMap[k].vlan)});
  });
  vlans.sort(function(a,b){return a.id-b.id});
  return {id:uid(),name:String(o.name||"Imported network").slice(0,80),isp:String(o.isp||"").slice(0,60),vlans:vlans,devices:devices};
}

      if(nets.length) return {networks:nets,activeId:nets.some(function(n){return n.id===o.activeId})?o.activeId:nets[0].id};

}

function updateHistory(){
  var u=$("#undoBtn"),r=$("#redoBtn");

function mark(key){
  var now=Date.now();
  if(key&&key===lastKey&&now-lastT<1200){lastT=now;return}
  lastKey=key||null;lastT=now;

  if(undoStack.length>100)undoStack.shift();
  redoStack=[];
  updateHistory();
}
function restore(str){
  var before=store.networks.map(function(n){return n.id});
  store.networks=JSON.parse(str);
  var ids=store.networks.map(function(n){return n.id});
  var added=ids.filter(function(i){return before.indexOf(i)<0})[0];
  if(added)store.activeId=added;
  else if(ids.indexOf(store.activeId)<0)store.activeId=ids[0];
  if(selectedId&&!dev(selectedId)){selectedId=null;selPort=null}
  frozenB=null;lastKey=null;confirmDev=false;confirmNet=false;confirmVlan=null;
  persist(true);renderAll();
}
function undo(){
  if(!undoStack.length)return;
  redoStack.push(snap());
  restore(undoStack.pop());
  setStatus(tr("st.undone"));

/* ---------- layout ---------- */
function descendants(id){
  var out=new Set(),queue=[id],devs=net().devices;
  while(queue.length){
    var cur=queue.shift();
    devs.forEach(function(d){ if(d.uplinkId===cur&&!out.has(d.id)){out.add(d.id);queue.push(d.id)} });
  }
  return out;
}

function layout(n){
  var devs=n.devices, ids=new Set(devs.map(function(d){return d.id})), parent={};
  devs.forEach(function(d){parent[d.id]=(d.uplinkId&&ids.has(d.uplinkId)&&d.uplinkId!==d.id)?d.uplinkId:ROOT});
  devs.forEach(function(d){
    var seen=new Set([d.id]),p=parent[d.id];
    while(p!==ROOT){
      if(p===d.id){parent[d.id]=ROOT;break}
      if(seen.has(p))break;
      seen.add(p);p=parent[p];
    }
  });
  var kids={};kids[ROOT]=[];
  devs.forEach(function(d){kids[d.id]=[]});
  devs.forEach(function(d){kids[parent[d.id]].push(d)});
  var memo={};
  function span(id){var ks=kids[id];return ks.reduce(function(s,k){return s+wid(k.id)},0)+Math.max(0,ks.length-1)*GX}
  function wid(id){if(memo[id]!=null)return memo[id];return memo[id]=Math.max(W,span(id))}
  var auto={};
  function place(id,left,depth){
    var w=wid(id),cx=left+w/2;
    auto[id]={x:cx-W/2,y:depth===0?0:IH+GY+(depth-1)*(H+GY)};
    var x=left+(w-span(id))/2;
    kids[id].forEach(function(k){place(k.id,x,depth+1);x+=wid(k.id)+GX});
  }
  place(ROOT,0,0);
  var pos={};pos[ROOT]=auto[ROOT];
  devs.forEach(function(d){var a=auto[d.id];pos[d.id]={x:Number.isFinite(d.x)?d.x:a.x,y:Number.isFinite(d.y)?d.y:a.y}});
  var x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  function add(p,w,h){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x+w);y1=Math.max(y1,p.y+h)}
  add(pos[ROOT],W,IH);
  devs.forEach(function(d){add(pos[d.id],W,H)});
  var bx=x0-PAD,by=y0-PAD,bw=x1-x0+PAD*2,bh=y1-y0+PAD*2;
  if(bw<460){bx-=(460-bw)/2;bw=460}
  if(bh<280)bh=280;
  return {pos:pos,parent:parent,bounds:{x:bx,y:by,w:bw,h:bh}};
}

function pill(cx,y,text,strong){
  var w=Math.max(30,text.length*6.4+14);
  return '<g><rect x="'+(cx-w/2)+'" y="'+(y-9)+'" width="'+w+'" height="18" rx="9" style="fill:var(--panel);stroke:var(--line);stroke-width:1"/>'+
    '<text x="'+cx+'" y="'+(y+4)+'" text-anchor="middle" style="font:'+(strong?600:500)+' 10.5px var(--mono);fill:'+(strong?"var(--ink)":"var(--muted)")+'">'+esc(text)+'</text></g>';
}

function linkText(d){
  var cnt=parseInt(d.lagCount,10)||2,parts=[];
  if(d.linkSpeed)parts.push((d.linkLag?cnt+"× ":"")+d.linkSpeed);
  else if(d.linkLag)parts.push("LAG ×"+cnt);
  if(d.linkMedia)parts.push(tr("media."+d.linkMedia).toLowerCase());
  return parts.join(" ");
}

function nodeMarkup(d,p,sel,vmap){
  var T=TYPES[d.type]||TYPES.other,c="var("+T.v+")",v=d.vlan?vmap[d.vlan]:null;
  var tip=[(d.name||tr("unnamed"))+" ("+T.label+")"];
  [["f.model","model"],["f.serial","serial"],["f.ip","ip"],["f.mac","mac"],["f.location","location"]].forEach(function(r){if(d[r[1]])tip.push(tr(r[0])+": "+d[r[1]])});
  var vtxt="";
  if(d.vlan){
    vtxt="VLAN "+d.vlan+(v&&v.name?" "+v.name:"");
    tip.push(vtxt+(v&&v.subnet?" ("+v.subnet+")":""));
  }
  var lt=linkText(d);
  if(lt)tip.push(tr("f.link")+": "+lt);
  var hasW=d.type==="ap"&&d.ssidList.length>0;
  if(hasW)tip.push(tr("f.ssids")+": "+d.ssidList.map(function(z){return (z.name||"?")+(z.vlan?" (VLAN "+z.vlan+")":"")}).join(", "));
  var vline=d.vlan?'<circle cx="59" cy="73" r="4" style="fill:'+(v?v.color:"var(--muted)")+'"/>'+
    '<text x="68" y="77" style="font:500 10.5px var(--sans);fill:var(--muted)">'+esc(trunc(vtxt,hasW?11:20))+'</text>':"";
  var wl=hasW?'<g transform="translate('+(W-36)+' 66)" style="fill:none;stroke:var(--ap);stroke-width:1.4;stroke-linecap:round">'+
    '<circle cx="5" cy="9.5" r=".9" style="fill:var(--ap)"/><path d="M2.6 6.6a3.4 3.4 0 0 1 4.8 0M.6 4.2a6.3 6.3 0 0 1 8.8 0"/></g>'+
    '<text x="'+(W-12)+'" y="77" text-anchor="end" style="font:500 10.5px var(--sans);fill:var(--muted)">'+d.ssidList.length+'</text>':"";
  return '<g class="node" data-id="'+d.id+'" tabindex="0" role="button" aria-label="'+esc((d.name||tr("unnamed"))+", "+T.label)+'" transform="translate('+p.x+' '+p.y+')" style="cursor:grab">'+
    '<title>'+esc(tip.join("\n"))+'</title>'+
    '<clipPath id="cp-'+d.id+'"><rect width="'+W+'" height="'+H+'" rx="9"/></clipPath>'+
    '<rect width="'+W+'" height="'+H+'" rx="9" style="fill:var(--node);stroke:'+(sel?"var(--ink)":"var(--line)")+';stroke-width:'+(sel?2.5:1.25)+'"/>'+
    '<rect width="8" height="'+H+'" clip-path="url(#cp-'+d.id+')" style="fill:'+c+'"/>'+
    '<g transform="translate(19 '+(H/2-12)+')" style="fill:none;stroke:'+c+';stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round">'+T.icon+'</g>'+
    '<text x="54" y="27" style="font:600 13px var(--sans);fill:var(--ink)">'+esc(trunc(d.name||tr("unnamed"),15))+'</text>'+
    '<text x="54" y="44" style="font:400 11px var(--sans);fill:var(--muted)">'+esc(trunc(d.model||T.label,20))+'</text>'+
    '<text x="54" y="60" style="font:400 11px var(--mono);fill:var(--muted)">'+esc(trunc(d.ip,17))+'</text>'+
    vline+wl+
  '</g>';
}

function diagramMarkup(n,L,selId,bgVar){
  bgVar=bgVar||"--bg";
  var edges="",pills="",nodes="";
  var vmap={};n.vlans.forEach(function(v){vmap[v.id]=v});
  var ip=L.pos[ROOT];
  nodes+='<g transform="translate('+ip.x+' '+ip.y+')">'+
    '<rect width="'+W+'" height="'+IH+'" rx="'+(IH/2)+'" style="fill:var(--node);stroke:var(--muted);stroke-width:1.25;stroke-dasharray:5 4"/>'+
    '<text x="'+(W/2)+'" y="'+(n.isp?24:33)+'" text-anchor="middle" style="font:600 13px var(--sans);fill:var(--ink)">'+esc(tr("dia.internet"))+'</text>'+
    (n.isp?'<text x="'+(W/2)+'" y="41" text-anchor="middle" style="font:400 11px var(--sans);fill:var(--muted)">'+esc(trunc(n.isp,26))+'</text>':"")+
  '</g>';
  n.devices.forEach(function(d){
    var pid=L.parent[d.id],c=L.pos[d.id],p=L.pos[pid],ph=pid===ROOT?IH:H;
    var x1=p.x+W/2,y1=p.y+ph,x2=c.x+W/2,y2=c.y,ym=y1+(y2-y1)/2;
    var lv=d.vlan&&vmap[d.vlan],lc=lv?lv.color:"var(--link)",pd="M"+x1+" "+y1+" V"+ym+" H"+x2+" V"+y2;
    if(d.linkLag){
      edges+='<path d="'+pd+'" style="fill:none;stroke:'+lc+';stroke-width:6;stroke-linejoin:round"/>'+
             '<path d="'+pd+'" style="fill:none;stroke:var('+bgVar+');stroke-width:2.5;stroke-linejoin:round"/>';
    }else{
      edges+='<path d="'+pd+'" style="fill:none;stroke:'+lc+';stroke-width:'+(lv?2.25:1.75)+';'+(pid===ROOT?"stroke-dasharray:6 4":"")+'"/>';
    }
    var lt=linkText(d);
    if(lt)pills+=pill(x2,ym,trunc(lt,24),true);
    var label="";
    if(pid===ROOT){label=d.type==="mx"?d.wan:""}
    else if(d.parentPort&&d.uplinkPort){label=d.parentPort+" → "+d.uplinkPort}
    else label=d.parentPort||d.uplinkPort||"";
    if(label)pills+=pill(x2,y2-17,trunc(label,26));
  });
  n.devices.forEach(function(d){nodes+=nodeMarkup(d,L.pos[d.id],d.id===selId,vmap)});
  var hint="";
  if(!n.devices.length){
    hint='<text x="'+(ip.x+W/2)+'" y="'+(IH+58)+'" text-anchor="middle" style="font:400 13px var(--sans);fill:var(--muted)">'+esc(tr("dia.hint"))+'</text>';
  }
  return edges+pills+nodes+hint;
}

var svg=$("#dia"),gEl=$("#g"),canvas=$("#canvas"),editEl=$("#edit");

function renderDiagram(refocus){
  var n=net(),L=layout(n);lastLayout=L;
  var b=frozenB||L.bounds;
  svg.setAttribute("viewBox",b.x+" "+b.y+" "+b.w+" "+b.h);
  svg.setAttribute("width",Math.round(b.w*zoom));
  svg.setAttribute("height",Math.round(b.h*zoom));
  gEl.innerHTML=diagramMarkup(n,L,selectedId);
  $("#zoomLbl").textContent=Math.round(zoom*100)+"%";
  renderLegend();
  if(refocus&&selectedId){var el=gEl.querySelector('[data-id="'+selectedId+'"]');if(el)el.focus()}
}

function fit(){
  if(!lastLayout)return;
  var b=lastLayout.bounds,cw=canvas.clientWidth,ch=canvas.clientHeight;
  if(!cw||!ch)return;
  zoom=Math.round(clamp(Math.min(cw/b.w,ch/b.h,1),.3,2)*100)/100;
  renderDiagram();
}

function field(label,key,val,ph,mono){

function phOf(p){return !p?"":(p.charAt(0)==="="?p.slice(1):tr(p))}
function optHtml(opts,val){
  return opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===val?" selected":"")+'>'+esc(o[1])+'</option>'}).join("");
}
function selField(label,key,val,opts){
  return '<label class="f"><span>'+esc(label)+'</span><select data-k="'+key+'">'+optHtml(opts,val)+'</select></label>';
}
function vlanOpts(cur){
  var vs=net().vlans,o=[["",tr("vlan.none")]].concat(vs.map(function(v){return [v.id,v.id+(v.name?" "+v.name:"")]}));
  if(cur&&!vs.some(function(v){return v.id===cur}))o.push([cur,cur+" "+tr("vlan.undef")]);
  return o;
}

/* port map */
function portCount(d){return clamp(parseInt(d.ports,10)||0,0,96)}
function portNum(s){var m=/(\d+)\s*$/.exec(String(s||""));return m?String(+m[1]):""}
function portLinks(d){
  var map={};
  net().devices.forEach(function(x){
    if(x.uplinkId===d.id){var k=portNum(x.parentPort);if(k)(map[k]=map[k]||[]).push(x.name||tr("unnamed"))}
  });
  return map;
}
function portGridHtml(d){
  var n=portCount(d);
  if(!n)return '<p class="muted">'+esc(tr("port.noCount"))+'</p>';
  var links=portLinks(d),upk=portNum(d.uplinkPort),vm={},used=0,tiles="";
  net().vlans.forEach(function(v){vm[v.id]=v});
  for(var i=1;i<=n;i++){
    var k=String(i),e=d.portMap[k]||null,ln=links[k]||[],up=k===upk,v=e&&e.vlan?vm[e.vlan]:null;
    var isUsed=!!(e&&isPortUsed(e))||ln.length>0||up;
    if(isUsed)used++;
    var info=[tr("port.title",{n:i})];
    if(e&&e.name)info.push(e.name);
    if(e&&e.vlan)info.push("VLAN "+e.vlan);
    if(e&&e.mode==="trunk")info.push(tr("mode.trunk"));
    if(e&&e.poe)info.push("PoE");
    ln.forEach(function(l){info.push(l)});
    if(up)info.push(tr("port.isUplink"));
    tiles+='<button type="button" class="pt'+(isUsed?" used":"")+(up?" up":"")+(selPort===k?" on":"")+'" data-act="pick-port" data-port="'+k+'" style="--c:'+(v?v.color:(e&&e.vlan?"var(--muted)":"var(--line)"))+'" aria-pressed="'+(selPort===k)+'" aria-label="'+esc(info.join(", "))+'" title="'+esc(info.join("\n"))+'"><b>'+i+'</b>'+(e&&e.poe?"<i></i>":"")+'</button>';
  }
  return '<p class="muted portmeta">'+esc(tr("port.used",{used:used,n:n}))+'</p><div class="pgrid">'+tiles+'</div>';
}
function portEditHtml(d){
  var cnt=portCount(d);
  if(!selPort||!cnt||+selPort>cnt)return '<p class="muted">'+esc(tr("port.pick"))+'</p>';
  var k=selPort,e=d.portMap[k]||{name:"",vlan:"",mode:"access",poe:false,allowed:""};
  var links=portLinks(d)[k]||[],trunk=e.mode==="trunk";
  return '<h4>'+esc(tr("port.title",{n:k}))+'</h4>'+
    (links.length?'<p class="muted">'+esc(tr("port.linked",{name:links.join(", ")}))+'</p>':"")+
    (portNum(d.uplinkPort)===k?'<p class="muted">'+esc(tr("port.isUplink"))+'</p>':"")+
    '<label class="f"><span>'+esc(tr("f.portName"))+'</span><input data-pk="name" dir="auto" value="'+esc(e.name)+'" placeholder="'+esc(tr("ph.portName"))+'" autocomplete="off"></label>'+
    '<div class="g2"><label class="f"><span>'+esc(tr("f.portMode"))+'</span><select data-pk="mode">'+optHtml([["access",tr("mode.access")],["trunk",tr("mode.trunk")]],trunk?"trunk":"access")+'</select></label>'+
    '<label class="f"><span>'+esc(tr(trunk?"f.nativeVlan":"f.vlan"))+'</span><select data-pk="vlan">'+optHtml(vlanOpts(e.vlan),e.vlan)+'</select></label></div>'+
    (trunk?'<label class="f"><span>'+esc(tr("f.allowed"))+'</span><input data-pk="allowed" class="mono" dir="ltr" value="'+esc(e.allowed)+'" placeholder="'+esc(tr("ph.allowed"))+'" autocomplete="off"></label>':"")+
    '<label class="chk"><input type="checkbox" data-pk="poe"'+(e.poe?" checked":"")+'><span>'+esc(tr("f.poe"))+'</span></label>'+
    '<button type="button" class="btn" data-act="clear-port">'+esc(tr("port.clear"))+'</button>';
}
function portSecInner(d){return '<div id="pgridWrap">'+portGridHtml(d)+'</div><div id="pedit" class="pedit">'+portEditHtml(d)+'</div>'}

/* ---------- VLANs ---------- */
function vlanSelect(d){
  var vs=net().vlans,known=vs.some(function(v){return v.id===d.vlan});
  var label=tr((d.type==="mx"||d.type==="switch"||d.type==="ap")?"f.vlanMgmt":"f.vlan");
  var o='<option value="">'+esc(tr(vs.length?"vlan.none":"vlan.noneAdd"))+'</option>'+vs.map(function(v){
    return '<option value="'+esc(v.id)+'"'+(v.id===d.vlan?" selected":"")+'>'+esc(v.id+(v.name?" "+v.name:""))+'</option>';
  }).join("");
  if(d.vlan&&!known)o+='<option value="'+esc(d.vlan)+'" selected>'+esc(d.vlan)+' '+esc(tr("vlan.undef"))+'</option>';
  return '<label class="f"><span>'+esc(label)+'</span><select data-k="vlan">'+o+'</select></label>';
}
function nextColor(n){
  var used=n.vlans.map(function(v){return v.color.toLowerCase()});
  var free=PALETTE.filter(function(c){return used.indexOf(c)<0});
  return free.length?free[0]:PALETTE[n.vlans.length%PALETTE.length];
}

      '<button type="button" class="btn vx '+(conf?"confirm":"danger")+'" data-act="del-vlan" data-id="'+id+'" aria-label="'+esc(tr("vlan.aria.delete",{id:v.id}))+'">'+esc(tr(conf?"vlan.delConfirm":"vlan.del"))+'</button></div>'+
      '<div class="g2"><input type="text" dir="auto" data-vid="'+id+'" data-vk="name" value="'+esc(v.name)+'" placeholder="'+esc(tr("vlan.nameShort"))+'" aria-label="'+esc(tr("vlan.aria.nameOf",{id:v.id}))+'">'+
      '<input type="text" class="mono" dir="ltr" data-vid="'+id+'" data-vk="subnet" value="'+esc(v.subnet)+'" placeholder="'+esc(tr("vlan.subnetShort"))+'" aria-label="'+esc(tr("vlan.aria.subnetOf",{id:v.id}))+'"></div></div>';
  }).join(""):'<p class="muted">'+esc(tr("vlan.empty"))+'</p>';
}
function renderLegend(){
  var n=net(),el=$("#legend");
  if(!n.vlans.length){el.hidden=true;el.innerHTML="";return}
  var cnt={};n.devices.forEach(function(d){if(d.vlan)cnt[d.vlan]=(cnt[d.vlan]||0)+1});
  el.innerHTML=n.vlans.map(function(v){
    return '<span style="--c:'+esc(v.color)+'"><i></i><strong>VLAN '+esc(v.id)+'</strong>'+(v.name?" "+esc(v.name):"")+
      (v.subnet?' <small>'+esc(v.subnet)+'</small>':"")+' <small>('+(cnt[v.id]||0)+')</small></span>';
  }).join("");
  el.hidden=false;
}
function legendSvg(n,w){
  var x=0,y=0,out="";
  n.vlans.forEach(function(v){
    var label="VLAN "+v.id+(v.name?" "+v.name:"")+(v.subnet?" ("+v.subnet+")":"");
    var cw=26+label.length*6.4+18;
    if(x>0&&x+cw>w){x=0;y+=22}
    out+='<rect x="'+x+'" y="'+(y+6)+'" width="16" height="4" rx="2" style="fill:'+v.color+'"/>'+
      '<text x="'+(x+22)+'" y="'+(y+12)+'" style="font:400 12px var(--sans);fill:var(--ink)">'+esc(label)+'</text>';
    x+=cw;
  });
  return {svg:out,h:n.vlans.length?y+22:0};
}

/* ---------- state changes ---------- */
function touch(){persist();renderDiagram();renderDevs();renderNets()}

function select(id,opts){
  if(selectedId!==id)selPort=null;
  selectedId=id;confirmDev=false;
  renderDevs();renderForm();renderDiagram(opts&&opts.refocus);
  if(id&&opts&&opts.scroll&&isMobile())editEl.scrollIntoView({behavior:"smooth",block:"start"});
}

function switchNet(id){
  store.activeId=id;selectedId=null;selPort=null;confirmDev=false;confirmNet=false;confirmVlan=null;frozenB=null;
  persist();renderAll();
  requestAnimationFrame(fit);
}

function addDevice(type){
  mark(null);
  var n=net(),count=n.devices.filter(function(d){return d.type===type}).length+1;
  var name=TYPES[type].prefix+"-"+String(count).padStart(2,"0");
  var up="";
  if(type!=="mx"){
    var sel=selectedId&&dev(selectedId),ep=!!ENDPOINTS[type];
    var mx=n.devices.find(function(d){return d.type==="mx"}),sw=n.devices.find(function(d){return d.type==="switch"});
    if(sel&&(sel.type==="mx"||sel.type==="switch"||(ep&&sel.type==="ap")))up=sel.id;
    else up=type==="switch"?((mx||sw||{}).id||""):((sw||mx||{}).id||"");
  }
  var d=blank(type,{name:name,uplinkId:up,ports:type==="switch"?"24":""});
  n.devices.push(d);
  persist();
  select(d.id,{scroll:true});
  renderNets();
  var inp=editEl.querySelector('[data-k="name"]');
  if(inp&&!isMobile()){inp.focus();inp.select()}
}

/* ---------- file save / open / export ---------- */
var dlPromise=(function(){
  try{if(window.claude&&typeof window.claude.use==="function")return window.claude.use("downloads").catch(function(){return null})}catch(e){}
  return Promise.resolve(null);
})();

function showFallback(name,text){
  $("#fbName").textContent=name;
  $("#fbText").value=text;
  var dlg=$("#fb");
  if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","");
}
async function deliver(filename,data,okMsg){
  var dl=await dlPromise;
  if(!dl){
    try{
      var type=/\.svg$/.test(filename)?"image/svg+xml":/\.png$/.test(filename)?"image/png":"application/json";
      var blob=(typeof data==="string")?new Blob([data],{type:type}):data;
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},1000);
      setStatus(okMsg+" "+tr("st.downloads"));
    }catch(err){
      if(typeof data==="string")showFallback(filename,data);else setStatus(tr("st.pngFail"));
    }
    return;
  }
  try{
    await dl.save({filename:filename,data:data});
    setStatus(okMsg);
  }catch(e){
    var code=e&&e.code;
    if(code==="declined")setStatus(tr("st.cancelled"));
    else if(code==="rate_limited")setStatus(tr("st.rate"));
    else if(typeof data==="string")showFallback(filename,data);
    else setStatus(tr("st.pngFail"));
  }
}
function saveFile(){
  var n=net();
  var data=JSON.stringify({format:"network-map",version:3,name:n.name,isp:n.isp||"",vlans:n.vlans,devices:n.devices},null,2);
  deliver(slug(n.name)+".network.json",data,tr("st.fileSaved"));
}
function svgInfo(){
  var n=net(),L=layout(n),b=L.bounds;
  var cs=getComputedStyle(document.documentElement);
  var lg=legendSvg(n,b.w-32),top=lg.h?lg.h+14:0,y0=b.y-top,h=b.h+top;
  var str='<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+b.x+' '+y0+' '+b.w+' '+h+'" width="'+b.w+'" height="'+h+'">'+
    '<rect x="'+b.x+'" y="'+y0+'" width="'+b.w+'" height="'+h+'" style="fill:var(--panel)"/>'+
    (lg.h?'<g transform="translate('+(b.x+16)+' '+(y0+8)+')">'+lg.svg+'</g>':"")+
    diagramMarkup(n,L,null,"--panel")+'</svg>';
  str=str.replace(/var\((--[\w-]+)\)/g,function(m,k){var v=cs.getPropertyValue(k).trim();return v?v.replace(/"/g,"'"):m});
  return {svg:str,w:b.w,h:h};
}
function exportSvg(){deliver(slug(net().name)+".svg",svgInfo().svg,tr("st.svgSaved"))}
function exportPng(){
  var info=svgInfo(),scale=Math.min(2,8000/Math.max(info.w,info.h));
  var img=new Image();
  img.onload=function(){
    try{
      var c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(info.w*scale));
      c.height=Math.max(1,Math.round(info.h*scale));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(blob){
        if(!blob){setStatus(tr("st.pngFail"));return}
        deliver(slug(net().name)+".png",blob,tr("st.pngSaved"));
      },"image/png");
    }catch(err){setStatus(tr("st.pngFail"))}
  };
  img.onerror=function(){setStatus(tr("st.pngFail"))};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(info.svg);
}

function importText(text){
  var o;
  try{o=JSON.parse(text)}catch(e){setStatus(tr("st.badJson"));return}
  try{
    var n=sanitizeNet(o);
    mark(null);
    store.networks.push(n);
    switchNet(n.id);
    setStatus(tr("st.opened",{name:n.name,count:plural("count",n.devices.length)}));
  }catch(e){setStatus(e.message)}
}

/* ---------- events ---------- */
var actions={
  "pick-net":function(t){switchNet(t.dataset.id)},
  "pick-dev":function(t){select(t.dataset.id,{scroll:true})},
  "add":function(t){addDevice(t.dataset.type)},
  "import":function(){$("#file").click()},
  "save-file":saveFile,
  "export-svg":exportSvg,
  "auto":function(){mark(null);net().devices.forEach(function(d){delete d.x;delete d.y});persist();renderDiagram();fit()},
  "zoom-in":function(){zoom=Math.round(clamp(zoom+.1,.3,2)*100)/100;renderDiagram()},
  "zoom-out":function(){zoom=Math.round(clamp(zoom-.1,.3,2)*100)/100;renderDiagram()},
  "fit":fit,
  "undo":undo,
  "redo":redo,
  "export-png":exportPng,
  "pick-port":function(t){selPort=(selPort===t.dataset.port)?null:t.dataset.port;renderPortSec();var b=editEl.querySelector('.pt[data-port="'+t.dataset.port+'"]');if(b)b.focus()},
  "clear-port":function(){var d=selectedId&&dev(selectedId);if(!d||!selPort)return;mark(null);delete d.portMap[selPort];persist();renderPortSec()},
  "add-ssid":function(){
    var d=selectedId&&dev(selectedId);if(!d||d.ssidList.length>=16)return;
    mark(null);d.ssidList.push({name:"",vlan:"",band:"",sec:""});
    persist();renderWl();renderDiagram();
    var ins=editEl.querySelectorAll('[data-sk="name"]');if(ins.length)ins[ins.length-1].focus();
  },
  "del-ssid":function(t){var d=selectedId&&dev(selectedId);if(!d)return;mark(null);d.ssidList.splice(+t.dataset.i,1);persist();renderWl();renderDiagram()},
  "del-net":function(){
    clearTimeout(confirmNetTimer);
    if(!confirmNet){
      confirmNet=true;renderNets();
      confirmNetTimer=setTimeout(function(){confirmNet=false;renderNets()},5000);
      return;
    }
    confirmNet=false;
    mark(null);
    var id=store.activeId,name=net().name;
    store.networks=store.networks.filter(function(n){return n.id!==id});
    if(!store.networks.length)store.networks.push({id:uid(),name:tr("net.new"),isp:"",vlans:[],devices:[]});
    switchNet(store.networks[0].id);
    setStatus(tr("st.deletedNet",{name:name}));
  },
  "del-vlan":function(t){
    var id=t.dataset.id;clearTimeout(vlanTimer);
    if(confirmVlan!==id){
      confirmVlan=id;renderVlans();
      vlanTimer=setTimeout(function(){confirmVlan=null;renderVlans()},5000);
      return;
    }
    confirmVlan=null;
    var n=net();
    mark(null);
    n.vlans=n.vlans.filter(function(v){return v.id!==id});
    persist();renderVlans();renderForm();renderDiagram();
    setStatus(tr("st.vlanDeleted",{id:id}));
  },
  "del-dev":function(){
    if(!confirmDev){confirmDev=true;renderForm();return}
    var n=net(),d=dev(selectedId);if(!d)return;
    mark(null);
    n.devices.forEach(function(x){if(x.uplinkId===d.id)x.uplinkId=d.uplinkId});
    n.devices=n.devices.filter(function(x){return x.id!==d.id});
    selectedId=null;confirmDev=false;
    persist();renderDevs();renderForm();renderDiagram();renderNets();
  }
};
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");
  if(t&&actions[t.dataset.act])actions[t.dataset.act](t);
  if(e.target.closest(".node")&&isMobile())editEl.scrollIntoView({behavior:"smooth",block:"start"});
});

$("#newForm").addEventListener("submit",function(e){
  e.preventDefault();
  var inp=$("#newName"),name=inp.value.trim();
  if(!name){inp.focus();return}
  var base=name,i=2;
  while(store.networks.some(function(n){return n.name===name}))name=base+" "+(i++);
  var n={id:uid(),name:name,isp:"",vlans:[],devices:[]};
  mark(null);
  store.networks.push(n);inp.value="";
  switchNet(n.id);
  setStatus(tr("st.created",{name:name}));
});

$("#netName").addEventListener("input",function(e){mark("n:"+store.activeId+":name");net().name=e.target.value;persist();renderNets()});
$("#isp").addEventListener("input",function(e){mark("n:"+store.activeId+":isp");net().isp=e.target.value;persist();renderDiagram()});

$("#file").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0];
  if(!f)return;
  if(f.size>5*1024*1024){setStatus(tr("st.tooLarge"));e.target.value="";return}
  var r=new FileReader();
  r.onload=function(){importText(String(r.result))};
  r.onerror=function(){setStatus(tr("st.readFail"))};
  r.readAsText(f);
  e.target.value="";
});

editEl.addEventListener("input",function(e){
  var t=e.target,k=t.dataset.k,d=selectedId&&dev(selectedId);
  if(!d)return;
  if(k){
    if(k==="type"||k==="uplinkId")return;
    mark("f:"+d.id+":"+k);
    d[k]=t.type==="checkbox"?t.checked:t.value;
    if(k==="name")$("#dhName").textContent=d.name||tr("unnamed");
    if(k==="linkLag"){var cnt=editEl.querySelector('[data-k="lagCount"]');if(cnt)cnt.disabled=!t.checked}
    if(k==="ports"||k==="uplinkPort")renderPortSec();
    touch();
    return;
  }
  if(t.dataset.sk){
    var row=t.closest(".srow"),i=row?+row.dataset.si:-1,z=d.ssidList[i];
    if(!z)return;
    mark("s:"+d.id+":"+i+":"+t.dataset.sk);
    z[t.dataset.sk]=t.value;
    persist();renderDiagram();
    return;
  }
  var pk=t.dataset.pk;
  if(pk&&selPort){
    mark("p:"+d.id+":"+selPort+":"+pk);
    var pe=d.portMap[selPort]||(d.portMap[selPort]={name:"",vlan:"",mode:"access",poe:false,allowed:""});
    pe[pk]=t.type==="checkbox"?t.checked:t.value;
    if(!isPortUsed(pe))delete d.portMap[selPort];
    persist();
    var gw=$("#pgridWrap");if(gw)gw.innerHTML=portGridHtml(d);
    if(pk==="mode")renderPortSec(true);
  }
});
editEl.addEventListener("change",function(e){
  var k=e.target.dataset.k,d=selectedId&&dev(selectedId);
  if(!k||!d)return;
  if(k==="type"){mark(null);d.type=e.target.value;touch();renderForm()}
  else if(k==="uplinkId"){mark(null);d.uplinkId=e.target.value;touch()}
});

$("#vlanForm").addEventListener("submit",function(e){
  e.preventDefault();
  var idEl=$("#vId"),id=idEl.value.trim().replace(/^0+(?=\d)/,""),n=net();
  if(!/^\d{1,4}$/.test(id)||+id<1||+id>4094){setStatus(tr("st.vlanBadId"));idEl.focus();return}
  if(n.vlans.some(function(v){return v.id===id})){setStatus(tr("st.vlanExists",{id:id}));idEl.focus();return}
  mark(null);
  n.vlans.push({id:id,name:$("#vName").value.trim().slice(0,40),subnet:$("#vSub").value.trim().slice(0,43),color:nextColor(n)});
  n.vlans.sort(function(a,b){return a.id-b.id});
  $("#vId").value="";$("#vName").value="";$("#vSub").value="";
  persist();renderVlans();renderForm();renderDiagram();
  setStatus(tr("st.vlanAdded",{id:id}));
  idEl.focus();
});
$("#vlans").addEventListener("input",function(e){
  var t=e.target,id=t.dataset.vid,k=t.dataset.vk;
  if(!id||!k)return;
  var v=net().vlans.find(function(x){return x.id===id});
  if(!v)return;
  mark("v:"+id+":"+k);
  v[k]=t.value;
  persist();renderDiagram();renderForm();
});

/* drag nodes (mouse and pen); touch taps select */
svg.addEventListener("pointerdown",function(e){
  var g=e.target.closest(".node");
  if(!g){if(selectedId)select(null);return}
  if(e.pointerType==="mouse"&&e.button!==0)return;
  var id=g.dataset.id,p=lastLayout.pos[id];
  if(!p||!dev(id))return;
  if(selectedId!==id)select(id);
  if(e.pointerType==="touch")return;
  drag={id:id,sx:e.clientX,sy:e.clientY,ox:p.x,oy:p.y,moved:false,pid:e.pointerId};
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove",function(e){
  if(!drag||e.pointerId!==drag.pid)return;
  var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved){
    if(Math.hypot(dx,dy)<4)return;
    drag.moved=true;mark(null);frozenB=Object.assign({},lastLayout.bounds);
  }
  var d=dev(drag.id),fb=frozenB;
  if(!d)return;
  d.x=Math.round(clamp(drag.ox+dx/zoom,fb.x,fb.x+fb.w-W));
  d.y=Math.round(clamp(drag.oy+dy/zoom,fb.y,fb.y+fb.h-H));
  if(!raf)raf=requestAnimationFrame(function(){raf=0;renderDiagram()});
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.pid)return;
  var moved=drag.moved;
  try{svg.releasePointerCapture(drag.pid)}catch(err){}
  drag=null;frozenB=null;
  if(moved){persist();renderDiagram()}
}
svg.addEventListener("pointerup",endDrag);
svg.addEventListener("pointercancel",endDrag);
svg.addEventListener("keydown",function(e){
  var g=e.target.closest&&e.target.closest(".node");
  if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();select(g.dataset.id,{refocus:true})}
});

document.addEventListener("keydown",function(e){
  if(!(e.ctrlKey||e.metaKey)||e.altKey)return;
  var el=e.target,tag=el&&el.tagName,k=String(e.key).toLowerCase();
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(el&&el.isContentEditable))return;
  if(k==="z"&&!e.shiftKey){e.preventDefault();undo()}
  else if((k==="z"&&e.shiftKey)||k==="y"){e.preventDefault();redo()}
});

$("#fbCopy").addEventListener("click",function(){
  var ta=$("#fbText");ta.select();
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value);
    else document.execCommand("copy");
  }catch(err){}
});

/* ---------- boot ---------- */
function applyStatic(){
  var de=document.documentElement;
  de.lang=lang;de.dir=lang==="ar"?"rtl":"ltr";
  document.title=tr("app.title");
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=tr(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-ph]").forEach(function(el){el.placeholder=tr(el.dataset.i18nPh)});
  document.querySelectorAll("[data-i18n-aria]").forEach(function(el){el.setAttribute("aria-label",tr(el.dataset.i18nAria))});
  document.querySelectorAll("[data-i18n-title]").forEach(function(el){el.title=tr(el.dataset.i18nTitle)});
  document.querySelectorAll('[data-act="add"]').forEach(function(b){b.innerHTML="<i></i>"+esc(TYPES[b.dataset.type].short)});
  $("#fbMsg").innerHTML=tr("fb.text",{name:'<code id="fbName"></code>'});
  $("#lang").value=lang;
}
$("#lang").addEventListener("change",function(e){
  lang=e.target.value;
  try{localStorage.setItem(LKEY,lang)}catch(err){}
  confirmNet=false;confirmDev=false;confirmVlan=null;
  applyStatic();renderAll();
  setStatus(tr("st.default"));
});
function renderAll(){renderBar();renderNets();renderDevs();renderVlans();renderForm();renderDiagram();updateHistory()}
applyStatic();
renderAll();
requestAnimationFrame(fit);
setStatus(tr("st.default"));
})();
